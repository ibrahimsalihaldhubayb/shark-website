// ---- Firestore load ----
function loadOffers(){
  _db.collection('offers').get({source:'server'})
    .then(function(snap){
      ST.offers=snap.docs.map(function(d){var o=d.data();o._id=d.id;return o;})
        .filter(function(o){return o.published===true;})
        .sort(function(a,b){return (b._ts||0)-(a._ts||0);});
      ST.loading=false;
      renderPage();
    })
    .catch(function(e){
      console.warn('offers load error',e);
      try{var ls=JSON.parse(localStorage.getItem('shark_offers')||'[]');
        ST.offers=ls.filter(function(o){return o.published===true;});}catch(x){ST.offers=[];}
      ST.loading=false;
      renderPage();
    });
}

// ---- Navigation ----
function go(page){
  ST.page=page;
  ST.drawerOpen=false;
  ST.offerActionsOpen=false;
  window.scrollTo({top:0,behavior:'instant'});
  renderAll();
}

function openOffer(id){
  ST.page='offer';
  ST.currentOfferId=id;
  ST.drawerOpen=false;
  ST.offerActionsOpen=false;
  window.scrollTo({top:0,behavior:'instant'});
  renderAll();
}

function toggleDrawer(){
  ST.drawerOpen=!ST.drawerOpen;
  document.getElementById('drawer').style.display=ST.drawerOpen?'block':'none';
}

function toggleLang(){
  ST.lang=ST.lang==='ar'?'en':'ar';
  document.documentElement.lang=ST.lang;
  document.documentElement.dir=ST.lang==='ar'?'rtl':'ltr';
  renderAll();
}

// Secret tap: 5 taps on logo → admin
function secretTap(){
  ST._tapCount=(ST._tapCount||0)+1;
  clearTimeout(ST._tapTimer);
  ST._tapTimer=setTimeout(function(){ST._tapCount=0;},1600);
  if(ST._tapCount>=5){ST._tapCount=0;window.location.href='admin.html';}
}

// ---- Toast ----
function showToast(msg){
  var el=document.getElementById('toastEl');
  el.textContent=msg;
  el.style.display='block';
  clearTimeout(ST._toastT);
  ST._toastT=setTimeout(function(){el.style.display='none';},2600);
}

function renderPage(){
