<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>الخريطة — شارك العقارية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="clients.js"></script>
<script src="projects.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#c8a96e;--gold2:#b8922a;--ink:#1a1a22;--sub:#7a7670;--line:rgba(0,0,0,.08);--bg:#f6f4f0;--av:#4fa776;--rs:#b3aea8;--sd:#c25b6e}
html,body{height:100%;font-family:'Cairo',Tahoma,Arial,sans-serif;direction:rtl;background:var(--bg);color:var(--ink);overflow:hidden}
button,input{font-family:'Cairo',sans-serif}

/* ── HEADER ── */
#hdr{position:fixed;top:0;left:0;right:0;z-index:2000;height:58px;padding:0 12px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line)}
.h-back{width:38px;height:38px;flex-shrink:0;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);text-decoration:none;background:#fff}
.h-logo{height:24px;flex-shrink:0}
.h-search{flex:1;position:relative;max-width:420px;margin-right:auto}
.h-search input{width:100%;height:38px;padding:0 36px 0 12px;border-radius:12px;border:1px solid var(--line);background:#f4f3f0;font-size:13px;color:var(--ink);outline:none}
.h-search input:focus{border-color:var(--gold);background:#fff}
.h-search svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:#9a958d;pointer-events:none}

/* ── FLOATING CONTROLS ── */
#ctrls{position:fixed;top:calc(68px + env(safe-area-inset-top));left:12px;right:12px;z-index:2150;pointer-events:none}
#ctrls>*{pointer-events:auto}
.row1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:flex;background:#fff;border-radius:14px;padding:4px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.seg button{display:flex;align-items:center;gap:6px;border:none;background:none;padding:7px 14px;border-radius:10px;font-size:13px;font-weight:800;color:#6b665f;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.dd{position:relative}
.dd-btn{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;background:#fff;border:none;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.1);font-size:13px;font-weight:800;color:var(--ink);cursor:pointer;white-space:nowrap}
.dd-menu{display:none;position:absolute;top:48px;left:0;width:min(300px,calc(100vw - 24px));max-height:55vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 12px 34px rgba(0,0,0,.18);padding:6px}
.dd.open .dd-menu{display:block}
.dd-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}
.dd-item:hover{background:#f6f3ec}
.dd-logo{width:46px;height:34px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;background:#fff;font-size:16px}
.dd-logo img{width:90%;height:90%;object-fit:contain}
.dd-t{font-size:13px;font-weight:800;line-height:1.3}
.dd-s{font-size:11px;color:var(--sub)}
.dd-empty{padding:16px;text-align:center;font-size:12px;color:var(--sub)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding:2px 1px 6px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:20px;border:none;background:#fff;color:#57524b;font-size:12px;font-weight:800;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.1)}
.chip.on{background:var(--gold);color:#1a1000}

/* ── MAP ── */
#map{position:fixed;inset:0;top:calc(58px + env(safe-area-inset-top));z-index:1;background:#ebe7e0}
.leaflet-container{font-family:'Cairo',sans-serif;direction:ltr}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.6)!important}

/* project marker: partner logo card */
.pm{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;filter:drop-shadow(0 4px 10px rgba(0,0,0,.22));transition:transform .15s;transform-origin:50% 100%}
.pm:hover,.pm.sel{transform:scale(1.08)}
.pm-box{width:78px;height:52px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:6px;overflow:hidden}
.pm.sel .pm-box{box-shadow:0 0 0 3px var(--gold)}
.pm-box img{width:100%;height:100%;object-fit:contain;display:block}
.pm-name{font-size:10.5px;font-weight:900;color:var(--ink);text-align:center;line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;direction:rtl}
.pm-tail{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-top:9px solid #fff;margin-top:-1px}
.pm-badge{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--av);color:#fff;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
/* offer marker: Shark logo */
.om{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;filter:drop-shadow(0 3px 8px rgba(0,0,0,.22));transition:transform .15s;transform-origin:50% 100%}
.om:hover,.om.sel{transform:scale(1.1)}
.om-box{width:58px;height:32px;background:#fff;border-radius:9px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;padding:4px 6px}
.om.sel .om-box{background:#fff8e9;box-shadow:0 0 0 3px rgba(200,169,110,.45)}
.om-box img{width:100%;height:100%;object-fit:contain}
.om-tail{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:8px solid var(--gold);margin-top:-1px}
.om-lbl{position:absolute;top:100%;margin-top:3px;left:50%;transform:translateX(-50%);background:var(--ink);color:#f0d080;font-size:10px;font-weight:800;border-radius:8px;padding:0 7px;white-space:nowrap;opacity:0;transition:opacity .2s;direction:rtl}
.show-lbl .om-lbl{opacity:1}
.plot-lbl span{display:block;transform:translate(-50%,-50%);font-size:10px;font-weight:900;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.65),0 0 1px #000;white-space:nowrap;pointer-events:none}
.me-dot{width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.2)}

/* ── LEGEND & FABS ── */
#legend{position:fixed;right:12px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:1500;display:none;flex-direction:column;gap:6px;align-items:flex-end}
#legend.on{display:flex}
.lg{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:5px 12px;font-size:12px;font-weight:700;box-shadow:0 1px 6px rgba(0,0,0,.12)}
.lg i{width:10px;height:10px;border-radius:50%}
#fabs{position:fixed;left:12px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:1500;display:flex;flex-direction:column;gap:10px}
.fab{width:46px;height:46px;border-radius:14px;border:none;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer}
.fab.on{background:var(--ink);color:#fff}

/* ── PROJECT CARD (top) ── */
#pcard{position:fixed;z-index:2100;left:50%;top:calc(170px + env(safe-area-inset-top));transform:translate(-50%,-16px);width:min(420px,calc(100% - 24px));background:#fff;border-radius:18px;box-shadow:0 14px 40px rgba(0,0,0,.2);overflow:hidden;opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.32,.72,0,1),opacity .2s}
#pcard.open{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.x{position:absolute;top:10px;left:10px;z-index:2;width:30px;height:30px;border-radius:50%;border:none;background:rgba(0,0,0,.08);color:var(--ink);font-size:18px;line-height:1;cursor:pointer}
.pc-row{display:flex;gap:12px;padding:12px 12px 10px}
.pc-logo{width:84px;height:84px;border-radius:14px;border:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.pc-logo img{width:86%;height:86%;object-fit:contain}
.pc-logo.cover img{max-width:none;max-height:none;width:100%;height:100%;object-fit:cover}
.pc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-left:28px}
.tag{font-size:10.5px;font-weight:800;color:var(--gold2)}
.nm{font-size:15px;font-weight:900;line-height:1.35}
.lc{font-size:11.5px;color:var(--sub)}
.pc-stats{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.pc-st{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;background:#f6f4f0;border-radius:8px;padding:2px 8px}
.pc-st i{width:7px;height:7px;border-radius:50%}
.bar{display:flex;height:5px;border-radius:4px;overflow:hidden;background:#eee;margin:0 12px}
.pc-hint{font-size:11px;color:var(--sub);padding:6px 12px 0}
.acts{display:flex;gap:8px;padding:10px 12px 12px}
.acts button{flex:1;padding:10px;border-radius:11px;font-size:12.5px;font-weight:800;cursor:pointer}
.b-pri{background:linear-gradient(135deg,#c8972e,#d4a83c 55%,#ba8420);color:#1a1000;border:none}
.b-sec{background:#fff;color:var(--ink);border:1px solid rgba(0,0,0,.14)}
.b-wa{flex:0 0 46px!important;background:#25d366;color:#fff;border:none;display:flex;align-items:center;justify-content:center}

/* ── OFFER CARD AT EXACT LOCATION ── */
.ocard-pop .leaflet-popup-content-wrapper{padding:0;border-radius:16px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.25)}
.ocard-pop .leaflet-popup-content{margin:0;width:250px!important;direction:rtl;text-align:right;line-height:1.5}
.ocard-pop a.leaflet-popup-close-button{top:8px;left:8px;right:auto;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font:18px/26px Arial;text-align:center;z-index:2}
.oc-img{display:block;width:100%;height:130px;object-fit:cover;background:linear-gradient(135deg,#f5f0e8,#ede8d8)}
div.oc-img{display:flex;align-items:center;justify-content:center}
div.oc-img img{width:110px;opacity:.5}
.oc-body{padding:10px 12px 0;display:flex;flex-direction:column;gap:2px}
.oc-price{font-size:15px;font-weight:900;color:var(--gold2)}
.oc-meta{display:flex;gap:10px;font-size:11px;color:#666}

/* ── PLOT SHEET (bottom) ── */
#sheet{position:fixed;z-index:2200;left:50%;bottom:0;transform:translate(-50%,105%);width:min(480px,100%);background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.2);padding:16px 16px calc(14px + env(safe-area-inset-bottom));transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:80vh;overflow:auto}
#sheet.open{transform:translate(-50%,0)}
#sheet .grab{width:38px;height:4px;border-radius:2px;background:#ddd;margin:-6px auto 10px}
.ps-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding-left:40px}
.hide-pm .pm{opacity:0;pointer-events:none}
.ps-logo{width:44px;height:34px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.ps-logo img{width:88%;height:88%;object-fit:contain}
.ps-no{font-size:22px;font-weight:900;line-height:1.1}
.pill{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:800}
.ps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}
.ps-c{background:#f6f4f0;border-radius:10px;padding:8px 10px}
.ps-k{font-size:10.5px;color:var(--sub)}
.ps-v{font-size:13px;font-weight:800}
.ps-price{display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(200,169,110,.4);background:#fffaf0;border-radius:12px;padding:10px 14px}
.ps-price b{font-size:19px;color:var(--gold2);font-weight:900}
#sheet .acts{padding:12px 0 0}

/* ── LIST VIEW ── */
#listview{position:fixed;left:0;right:0;bottom:0;top:calc(160px + env(safe-area-inset-top));z-index:1400;background:var(--bg);overflow:auto;padding:12px 12px 40px;display:none}
#listview.on{display:block}
body.list #fabs,body.list #legend{display:none!important}
.lv-h{font-size:13px;font-weight:900;margin:6px 4px 10px;color:var(--sub)}
.lv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:10px;margin-bottom:16px}
.lv-card{display:flex;gap:12px;background:#fff;border-radius:16px;padding:10px;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.lv-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.1)}
.lv-img{width:92px;height:80px;border-radius:12px;flex-shrink:0;overflow:hidden;background:#f3efe8;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
.lv-img img{width:100%;height:100%;object-fit:cover}
.lv-img.logo img{width:86%;height:86%;object-fit:contain}
.lv-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
.lv-empty{text-align:center;padding:40px 10px;color:var(--sub);font-size:13px}

/* ── OFFER MODAL ── */
#mod-offer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
#mod-offer.open{display:flex}
#mod-inner{background:#fff;border-radius:20px;padding:28px 24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.2)}
#mod-close{position:absolute;top:12px;left:16px;background:none;border:none;color:#aaa;font-size:24px;cursor:pointer}
.od-img{width:100%;height:200px;object-fit:cover;border-radius:12px;margin-bottom:14px}
.od-noimg{width:100%;height:140px;border-radius:12px;background:linear-gradient(135deg,#f5f0e8,#ede8d8);display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:14px}
.od-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.od-s{background:#f7f5f0;border-radius:8px;padding:9px;text-align:center}
.od-sv{font-size:13px;font-weight:700;color:#c8a96e}
.od-sk{font-size:10px;color:#888;margin-top:2px}
.btn-wa-od{width:100%;padding:12px;background:#25d366;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;justify-content:center}
.btn-int-od{width:100%;padding:12px;background:linear-gradient(135deg,#c8972e,#d4a83c 55%,#ba8420);color:#1a1000;border:none;border-radius:8px;font-size:13px;font-weight:800;cursor:pointer}
:root{--sub2:#888}
#mod-body [style*="var(--sub)"]{color:#666!important}

#empty{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1300;background:rgba(255,255,255,.95);border-radius:16px;padding:22px 26px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.1);display:none;pointer-events:none}
#empty b{display:block;font-size:15px;margin-bottom:4px}
#empty span{font-size:12px;color:var(--sub)}
@media(max-width:420px){.seg button{padding:7px 10px}.dd-btn{padding:0 11px}}
</style>
</head>
<body>

<header id="hdr">
  <a class="h-back" href="index.html" aria-label="الرئيسية"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>
  <img class="h-logo" src="logo.png" alt="شارك العقارية">
  <div class="h-search">
    <input id="q" type="search" placeholder="ابحث عن مشروع أو مدينة أو حي..." oninput="onSearch(this.value)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
  </div>
</header>

<div id="ctrls">
  <div class="row1">
    <div class="seg">
      <button id="v-map" class="on" onclick="setView('map')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg>الخريطة</button>
      <button id="v-list" onclick="setView('list')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>القائمة</button>
    </div>
    <div class="dd" id="dd">
      <button class="dd-btn" onclick="toggleDD(event)">تصفح المشاريع <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 9l6 6 6-6z"/></svg></button>
      <div class="dd-menu" id="dd-menu"></div>
    </div>
  </div>
  <div class="chips" id="chips">
    <button class="chip on" data-f="all">الكل</button>
    <button class="chip" data-f="projects">مشاريع الشركاء</button>
    <button class="chip" data-f="ours">عروض شارك</button>
    <button class="chip" data-f="lands">أراضي</button>
    <button class="chip" data-f="villa">فلل</button>
    <button class="chip" data-f="apartments">شقق</button>
    <button class="chip" data-f="warehouses">مستودعات</button>
    <button class="chip" data-f="commercial">تجاري</button>
  </div>
</div>

<div id="map"></div>
<div id="empty"><b>لا توجد نتائج</b><span>جرّب تصنيفاً آخر أو امسح البحث</span></div>

<div id="legend">
  <div class="lg"><i style="background:var(--av)"></i>متاحة للبيع</div>
  <div class="lg"><i style="background:var(--rs)"></i>محجوزة</div>
  <div class="lg"><i style="background:var(--sd)"></i>مباعة</div>
</div>
<div id="fabs">
  <button class="fab" title="موقعي" onclick="locateMe()"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg></button>
  <button class="fab" id="fab-layers" title="قمر صناعي" onclick="toggleLayers()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 2 10 5-10 5L2 7z"/><path d="m2 12 10 5 10-5M2 17l10 5 10-5"/></svg></button>
</div>

<div id="pcard"><button class="x" onclick="closeAll()">×</button><div id="pcard-body"></div></div>
<div id="sheet"><div class="grab"></div><button class="x" onclick="closeSheet()">×</button><div id="sheet-body"></div></div>
<div id="listview"></div>

<div id="mod-offer" onclick="if(event.target===this)closeMod()">
  <div id="mod-inner">
    <button id="mod-close" onclick="closeMod()">×</button>
    <div id="mod-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="plotmap.js"></script>

    'الدمام':[26.4207,50.0888],

    'الأحساء':[25.3814,49.5875],'احساء':[25.3814,49.5875],

  /* ── LOCATE ── */
  window.locateMe=function(){
    if(!navigator.geolocation){ alert('المتصفح لا يدعم تحديد الموقع'); return; }
    navigator.geolocation.getCurrentPosition(function(pos){
      var ll=[pos.coords.latitude,pos.coords.longitude];
      if(_me) map.removeLayer(_me);
      _me=L.marker(ll,{icon:L.divIcon({className:'',html:'<div class="me-dot"></div>',iconSize:[16,16],iconAnchor:[8,8]}),interactive:false}).addTo(map);
      map.flyTo(ll,14,{duration:.8});
    },function(){ alert('تعذّر تحديد موقعك — تأكد من السماح بالوصول للموقع'); },{enableHighAccuracy:true,timeout:10000});
  };

  /* ── OFFER MODAL ── */
  window.showMod=function(id){
    var o=_offers.find(function(x){return x.id===id;}); if(!o) return;
    var imgs=o.gallery?o.gallery.split('\n').filter(Boolean):[];
    document.getElementById('mod-body').innerHTML=
      (o.coverImg?'<img class="od-img" src="'+esc(o.coverImg)+'">':'<div class="od-noimg">🏠</div>')
      +'<div style="font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--gold);margin-bottom:5px">'+(TL[o.type]||o.type||'عقار')+'</div>'
      +'<div style="font-size:17px;font-weight:800;margin-bottom:6px">'+esc(o.ar||o.name||'')+'</div>'
      +'<div style="font-size:13px;color:var(--gold);margin-bottom:14px">📍 '+esc((o.city||'')+(o.district?' — '+o.district:''))+'</div>'
      +'<div class="od-stats">'
      +(o.price?'<div class="od-s"><div class="od-sv">'+fmt(o.price)+'</div><div class="od-sk">السعر</div></div>':'')
      +(o.area?'<div class="od-s"><div class="od-sv">'+o.area+' م²</div><div class="od-sk">المساحة</div></div>':'')
      +(o.beds?'<div class="od-s"><div class="od-sv">'+o.beds+'</div><div class="od-sk">غرف</div></div>':'')
      +'</div>'
      +(o.desc?'<p style="font-size:13px;color:var(--sub);line-height:1.8;margin-bottom:14px">'+esc(o.desc)+'</p>':'')
      +(imgs.length?'<div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none">'+imgs.map(function(s){return'<img src="'+esc(s)+'" style="height:64px;width:96px;object-fit:cover;border-radius:7px;flex-shrink:0">';}).join('')+'</div>':'')
      +'<button class="btn-wa-od" onclick="waOffer(\''+esc(o.ar||o.name||'')+'\')">'
      +'<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="margin-left:6px"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.121 1.533 5.847L.054 23.272a.5.5 0 0 0 .625.613l5.563-1.46A11.952 11.952 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg>'
      +'تواصل عبر واتساب</button>'
      +'<button class="btn-int-od" onclick="closeMod()">إغلاق</button>';
    document.getElementById('mod-offer').classList.add('open');
  };
  window.closeMod=function(){document.getElementById('mod-offer').classList.remove('open');};
  window.waOffer=function(t){window.open('https://wa.me/'+PHONE+'?text='+encodeURIComponent('السلام عليكم، أنا مهتم بالعقار: '+t),'_blank');};

  window.waText=function(t){window.open('https://wa.me/'+PHONE+'?text='+encodeURIComponent(t),'_blank');};

  /* ── LOAD ── */
  var pOffers=new Promise(function(res){
    try{
      var cfg={apiKey:"AIzaSyCJ59kjkb7mZ7pcsLImkT4L2-fdHFDTVko",authDomain:"sharek-re.firebaseapp.com",projectId:"sharek-re",storageBucket:"sharek-re.firebasestorage.app",messagingSenderId:"1000796915275",appId:"1:1000796915275:web:bb556f80db9d2f7f99efce"};
      if(!firebase.apps.length) firebase.initializeApp(cfg);
      firebase.firestore().collection('offers').orderBy('_ts','desc').get()
        .then(function(snap){ _offers=snap.docs.map(function(d){return d.data();}); if(!_offers.length) _offers=gs('shark_offers')||[]; res(); })
        .catch(function(){ _offers=gs('shark_offers')||[]; res(); });
    }catch(e){ _offers=gs('shark_offers')||[]; res(); }
  });
  var pProjects=SP?SP.loadPublished().then(function(l){_projects=l;}).catch(function(){}):Promise.resolve();
  Promise.all([pOffers,pProjects]).then(function(){
    var qs=new URLSearchParams(location.search), f=qs.get('filter'), pid=qs.get('project');
    if(f){ var b=document.querySelector('#chips .chip[data-f="'+f+'"]'); if(b){ _filter=f; document.querySelectorAll('#chips .chip').forEach(function(c){c.classList.toggle('on',c===b);}); } }
    rebuild();
    var p=pid&&_projects.find(function(x){return x.id===pid;});
    if(p) focusProject(p,true); else fitAll();
  });
})();
