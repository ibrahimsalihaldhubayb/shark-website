<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0b0b0c">
<title>خريطة العروض — شارك العقارية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="clients.js"></script>
<script src="projects.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#c8a96e;--dark:#0b0b0c;--card:#16181d;--border:rgba(244,243,239,.1);--text:#f4f3ef;--sub:#a8a59d}
html,body{height:100%;font-family:'Cairo',Tahoma,Arial,sans-serif;direction:rtl;background:#f2f2f7;color:#1a1a22;overflow:hidden}

/* ── TOP BAR ── */
#topbar{position:fixed;top:0;left:0;right:0;z-index:2000;height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;background:rgba(255,255,255,.96);border-bottom:1px solid rgba(0,0,0,.08);backdrop-filter:blur(16px)}
#topbar a{display:flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid rgba(0,0,0,.15);border-radius:20px;color:#444;font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap;flex-shrink:0;transition:.2s}
#topbar a:hover{border-color:#c8a96e;color:#c8a96e}
#search-wrap{flex:1;position:relative;max-width:380px}
#search-input{width:100%;padding:9px 36px 9px 14px;background:#f5f5f7;border:1px solid rgba(0,0,0,.1);border-radius:22px;color:#1a1a22;font-family:'Cairo',sans-serif;font-size:13px;outline:none;direction:rtl;transition:border-color .2s}
#search-input:focus{border-color:#c8a96e}
#search-input::placeholder{color:rgba(0,0,0,.3)}
#search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#999;pointer-events:none}
#filter-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
#filter-chips::-webkit-scrollbar{display:none}
.chip{padding:6px 14px;border:1px solid rgba(0,0,0,.12);border-radius:18px;background:#fff;color:#666;font-family:'Cairo',sans-serif;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.chip.on{border-color:#c8a96e;color:#fff;background:linear-gradient(135deg,#c8972e,#d4a83c)}

/* ── MAP ── */
#map{position:fixed;inset:0;top:56px;z-index:1}

/* ── BOTTOM PANEL ── */
#panel{position:fixed;bottom:0;left:0;right:0;z-index:2000;transition:transform .35s cubic-bezier(.32,.72,0,1)}
#panel.collapsed{transform:translateY(calc(100% - 64px))}
#panel-handle{height:64px;background:rgba(255,255,255,.97);border-top:1px solid rgba(0,0,0,.08);border-radius:18px 18px 0 0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;cursor:pointer;backdrop-filter:blur(16px);box-shadow:0 -4px 20px rgba(0,0,0,.08)}
#panel-handle-pill{width:36px;height:4px;border-radius:2px;background:rgba(0,0,0,.12);position:absolute;top:10px;left:50%;transform:translateX(-50%)}
#panel-count{font-size:13px;font-weight:700;color:#1a1a22}
#panel-count span{color:#c8a96e}
#panel-toggle{color:#888;font-size:18px;line-height:1;background:none;border:none;cursor:pointer;padding:8px;transition:transform .35s}
#panel.collapsed #panel-toggle{transform:rotate(180deg)}
#panel-body{background:#fff;max-height:52vh;overflow-y:auto;padding:0 12px 100px;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.1) transparent}
#panel-body::-webkit-scrollbar{width:4px}
#panel-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);border-radius:2px}
.list-card{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(0,0,0,.06);cursor:pointer;transition:background .15s;border-radius:8px}
.list-card:hover{background:rgba(200,169,110,.06)}
.list-card-img{width:80px;height:64px;border-radius:9px;object-fit:cover;flex-shrink:0;background:#f0ede8;display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(200,169,110,.6)}
.list-card-img img{width:80px;height:64px;border-radius:9px;object-fit:cover}
.list-card-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.list-card-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1a1a22}
.list-card-loc{font-size:11px;color:#888}
.list-card-price{font-size:13px;color:#c8a96e;font-weight:700;margin-top:2px}
.list-card-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(200,169,110,.12);border:1px solid rgba(200,169,110,.3);color:#b8922a;margin-bottom:3px}

/* ── ICON MARKERS ── */
.mk{position:relative;width:38px;height:46px;cursor:pointer;transition:transform .18s;transform-origin:50% 100%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.28))}
.mk:hover{transform:scale(1.12)}
.mk.sel{transform:scale(1.25);z-index:1000}
.mk svg.pin{position:absolute;inset:0;z-index:1}
.mk .mk-ic{position:absolute;z-index:2;top:7px;left:50%;transform:translateX(-50%);width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:#fff}
.mk.proj .mk-ic{color:#1a1000}
.mk-lbl{position:absolute;z-index:3;top:-22px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#1a1a22;border-radius:10px;padding:1px 8px;font-family:'Cairo',sans-serif;font-size:10.5px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.18);pointer-events:none;opacity:0;transition:opacity .2s}
.show-lbl .mk-lbl{opacity:1}
.mk.proj .mk-lbl{background:#1a1a22;color:#f0d080}

/* ── OFFER CARD AT EXACT LOCATION ── */
.ocard-pop .leaflet-popup-content-wrapper{padding:0;border-radius:16px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.25)}
.ocard-pop .leaflet-popup-content{margin:0;width:250px!important;font-family:'Cairo',sans-serif;direction:rtl;text-align:right;line-height:1.5}
.ocard-pop .leaflet-popup-tip{box-shadow:none}
.ocard-pop a.leaflet-popup-close-button{top:8px;left:8px;right:auto;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;font:18px/26px Arial;text-align:center;z-index:2}
.oc-img{display:block;width:100%;height:130px;object-fit:cover;background:linear-gradient(135deg,#f5f0e8,#ede8d8)}
div.oc-img{display:flex;align-items:center;justify-content:center;font-size:34px}
.oc-body{padding:10px 12px 4px;display:flex;flex-direction:column;gap:2px}
.ocard-pop .mc-acts{padding:8px 12px 12px}

/* ── FLOATING CARD ── */
#mcard{position:fixed;z-index:2100;left:50%;top:66px;transform:translate(-50%,-24px);width:min(380px,calc(100% - 24px));background:#fff;border-radius:18px;box-shadow:0 14px 44px rgba(0,0,0,.24);overflow:hidden;opacity:0;pointer-events:none;transition:transform .28s cubic-bezier(.32,.72,0,1),opacity .2s}
#mcard.open{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.mc-x{position:absolute;top:10px;left:10px;z-index:2;width:30px;height:30px;border-radius:50%;border:none;background:rgba(0,0,0,.5);color:#fff;font-size:18px;line-height:1;cursor:pointer}
.mc-row{display:flex;gap:12px;padding:12px}
.mc-img{width:108px;height:108px;border-radius:12px;object-fit:cover;flex-shrink:0;background:linear-gradient(135deg,#f5f0e8,#ede8d8);display:flex;align-items:center;justify-content:center;font-size:30px}
.mc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mc-tag{font-size:10px;font-weight:800;color:#b8922a;letter-spacing:.06em}
.mc-name{font-size:15px;font-weight:800;color:#1a1a22;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mc-loc{font-size:11.5px;color:#888}
.mc-price{font-size:15px;font-weight:900;color:#b8922a;margin-top:auto}
.mc-meta{display:flex;gap:10px;font-size:11px;color:#666;flex-wrap:wrap}
.mc-bar{display:flex;height:5px;border-radius:4px;overflow:hidden;background:#eee;margin-top:4px}
.mc-acts{display:flex;gap:8px;padding:0 12px 12px}
.mc-acts button{flex:1;padding:10px;border-radius:10px;font-family:'Cairo',sans-serif;font-size:12.5px;font-weight:800;cursor:pointer}
.mc-pri{background:linear-gradient(135deg,#c8972e,#d4a83c 55%,#ba8420);color:#1a1000;border:none}
.mc-sec{background:#fff;color:#1a1a22;border:1px solid rgba(0,0,0,.14)}
.mc-wa{flex:0 0 44px!important;background:#25d366;color:#fff;border:none;display:flex;align-items:center;justify-content:center}
.list-card-tag.proj{background:#1a1a22;border-color:#1a1a22;color:#f0d080}

/* ── EMPTY ── */
#empty-state{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1500;text-align:center;pointer-events:none;display:none;background:rgba(255,255,255,.9);border-radius:16px;padding:28px 32px;box-shadow:0 4px 24px rgba(0,0,0,.1)}
#empty-state h3{font-size:16px;font-weight:700;color:#1a1a22;margin-bottom:6px}
#empty-state p{font-size:13px;color:#888}

/* ── OFFER MODAL ── */
#mod-offer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
#mod-offer.open{display:flex}
#mod-inner{background:#fff;border:none;border-radius:20px;padding:28px 24px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.2)}
#mod-inner h4{font-size:17px;font-weight:800;color:#c8a96e;margin-bottom:16px}
#mod-close{position:absolute;top:12px;left:16px;background:none;border:none;color:#aaa;font-size:24px;cursor:pointer}
.od-img{width:100%;height:200px;object-fit:cover;border-radius:12px;margin-bottom:14px}
.od-noimg{width:100%;height:140px;border-radius:12px;background:linear-gradient(135deg,#f5f0e8,#ede8d8);display:flex;align-items:center;justify-content:center;font-size:40px;margin-bottom:14px}
.od-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.od-s{background:#f7f5f0;border-radius:8px;padding:9px;text-align:center}
.od-sv{font-size:13px;font-weight:700;color:#c8a96e}
.od-sk{font-size:10px;color:#888;margin-top:2px}
.btn-wa-od{width:100%;padding:12px;background:#25d366;color:#fff;border:none;border-radius:8px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px}
.btn-int-od{width:100%;padding:12px;background:linear-gradient(135deg,#c8972e,#d4a83c 55%,#ba8420);color:#1a1000;border:none;border-radius:8px;font-family:'Cairo',sans-serif;font-size:13px;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <a href="index.html">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    الرئيسية
  </a>
  <div id="search-wrap">
    <input id="search-input" type="text" placeholder="ابحث عن مدينة أو حي..." oninput="onSearch(this.value)">
    <svg id="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
  </div>
  <div id="filter-chips">
    <button class="chip on" onclick="setFilter('all',this)">الكل</button>
    <button class="chip" onclick="setFilter('lands',this)">أراضي</button>
    <button class="chip" onclick="setFilter('warehouses',this)">مستودعات</button>
    <button class="chip" onclick="setFilter('villa',this)">فلل</button>
    <button class="chip" onclick="setFilter('apartments',this)">شقق</button>
    <button class="chip" onclick="setFilter('commercial',this)">تجاري</button>
    <button class="chip" onclick="setFilter('projects',this)">مشاريع شركائنا</button>
  </div>
</div>

<!-- MAP -->
<div id="map"></div>

<!-- EMPTY STATE -->
<div id="empty-state">
  <h3>لا توجد عروض بعد</h3>
  <p>أضف عروضاً من لوحة الإدارة وستظهر هنا</p>
</div>

<!-- BOTTOM PANEL -->
<div id="panel" class="collapsed">
  <div id="panel-handle" onclick="togglePanel()">
    <div id="panel-handle-pill"></div>
    <div id="panel-count">العروض <span id="panel-num">0</span></div>
    <button id="panel-toggle">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 15l6-6 6 6"/></svg>
    </button>
  </div>
  <div id="panel-body"></div>
</div>

<!-- MARKER CARD -->
<div id="mcard"><button class="mc-x" onclick="closeCard()">×</button><div id="mcard-body"></div></div>

<!-- OFFER MODAL -->
<div id="mod-offer" onclick="if(event.target===this)closeMod()">
  <div id="mod-inner">
    <button id="mod-close" onclick="closeMod()">×</button>
    <div id="mod-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var PHONE='966539997060';
  var TL={warehouses:'مستودع',commercial:'تجاري',residential:'سكني',villas:'فيلا',villa:'فيلا',apartments:'شقة',apartment:'شقة',lands:'أرض',land:'أرض',agricultural:'زراعي',rest:'استراحة',chalets:'شاليه'};

  /* City lat/lng lookup */
  var CC={
    'الرياض':[24.7136,46.6753],'رياض':[24.7136,46.6753],
    'جدة':[21.4858,39.1925],
    'مكة المكرمة':[21.3891,39.8579],'مكة':[21.3891,39.8579],
    'المدينة المنورة':[24.5247,39.5692],'المدينة':[24.5247,39.5692],
    'الدمام':[26.4207,50.0888],
    'الخبر':[26.2172,50.1971],
    'الأحساء':[25.3814,49.5875],'احساء':[25.3814,49.5875],
    'تبوك':[28.3998,36.5700],
    'أبها':[18.2164,42.5053],'ابها':[18.2164,42.5053],
    'بريدة':[26.3292,43.9749],
    'حائل':[27.5219,41.7087],
    'نجران':[17.5656,44.2289],
    'جازان':[16.8892,42.5511],
    'ينبع':[24.0895,38.0618],
    'خميس مشيط':[18.3000,42.7333],
    'الجبيل':[27.0025,49.6603],
    'القطيف':[26.5597,50.0050],
    'الطائف':[21.2854,40.4146],'طائف':[21.2854,40.4146],
    'القصيم':[26.3292,43.9749],
    'عنيزة':[26.0858,43.9945],
    'سكاكا':[29.9697,40.2066],
    'حفر الباطن':[28.4339,46.0572]
  };

  function gs(k){try{return JSON.parse(localStorage.getItem(k)||'null');}catch(e){return null;}}
  function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function fmt(n){if(!n)return'—';var v=Number(String(n).replace(/,/g,''));if(!v)return n;if(v>=1000000)return(v/1000000).toLocaleString('ar',{maximumFractionDigits:2})+' مليون ريال';return v.toLocaleString('ar-SA')+' ريال';}

  /* ── MAP INIT ── */
  var map=L.map('map',{zoomControl:false,attributionControl:false}).setView([24.0,44.5],6);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" style="color:#777">OpenStreetMap</a>'
  }).addTo(map);

  /* zoom control top-left */
  L.control.zoom({position:'bottomleft'}).addTo(map);

  /* ── DATA ── */
  var _allOffers=[];
  var _projects=[];
  var _filter='all';
  var _search='';
  var _markers={};
  var _panelOpen=false;
  var _selKey=null;

  /* أيقونات حسب النوع */
  var IC={
    house:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg>',
    building:'<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M4 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v5h3a1 1 0 0 1 1 1v11h-6v-4h-4v4zm3-15v2h2V6zm4 0v2h2V6zm-4 4v2h2v-2zm4 0v2h2v-2zm-4 4v2h2v-2zm4 0v2h2v-2z"/></svg>',
    store:'<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M3 4h18l1 5a3 3 0 0 1-5 2.2A3 3 0 0 1 12 11a3 3 0 0 1-5 .2A3 3 0 0 1 2 9zm1 9.5a4.9 4.9 0 0 0 3-.3 5 5 0 0 0 5 0 5 5 0 0 0 5 0 4.9 4.9 0 0 0 3 .3V21h-6v-5h-4v5H4z"/></svg>',
    warehouse:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2 8v13h3V11h14v10h3V8zM7 13h10v2H7zm0 3h10v2H7zm0 3h10v2H7z"/></svg>',
    land:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg>',
    tree:'<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a6 6 0 0 0-5.6 8.2A5 5 0 0 0 9 19h2v3h2v-3h2a5 5 0 0 0 2.6-8.8A6 6 0 0 0 12 2z"/></svg>',
    project:'<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21v-2h1V9l6-3v3l5-3v4h2V3h4v18h1v2zm4-9v2h2v-2zm0 4v2h2v-2zm4-4v2h2v-2zm4 0v2h2v-2zm-4 4v2h2v-2zm4 0v2h2v-2z"/></svg>'
  };
  var TYPE_IC={villa:'house',villas:'house',residential:'house',rest:'house',chalets:'house',apartments:'building',apartment:'building',commercial:'store',warehouses:'warehouse',lands:'land',land:'land',agricultural:'tree'};

  function offerCoords(o){
    var lat=parseFloat(o.lat),lng=parseFloat(o.lng);
    if(isFinite(lat)&&isFinite(lng)&&(lat||lng)) return {c:[lat,lng],exact:true};
    var cc=cityCoords(o.city);
    return cc?{c:cc,exact:false}:null;
  }

  function filteredItems(){
    var q=_search.trim().toLowerCase();
    function qOk(name,city,district){return !q||(name||'').toLowerCase().indexOf(q)>=0||(city||'').toLowerCase().indexOf(q)>=0||(district||'').toLowerCase().indexOf(q)>=0;}
    var out=[];
    if(_filter==='all'||_filter==='projects'){
      _projects.forEach(function(p){ if(qOk(p.name,p.city,p.district)) out.push({key:'p:'+p.id,kind:'project',d:p}); });
    }
    if(_filter!=='projects'){
      _allOffers.forEach(function(o){
        if((_filter==='all'||o.type===_filter)&&qOk(o.ar||o.name,o.city,o.district)) out.push({key:'o:'+o.id,kind:'offer',d:o});
      });
    }
    return out;
  }

  function cityCoords(cityName){
    if(!cityName) return null;
    var k=Object.keys(CC).find(function(c){
      return cityName.indexOf(c)>=0||c.indexOf(cityName)>=0;
    });
    return k?CC[k]:null;
  }

  function shortPrice(n){
    var v=Number(String(n||'').replace(/,/g,'')); if(!v) return '';
    if(v>=1000000) return (v/1000000).toLocaleString('ar',{maximumFractionDigits:1})+' م';
    if(v>=1000) return Math.round(v/1000).toLocaleString('ar')+' ألف';
    return v.toLocaleString('ar');
  }

  function markerIcon(it){
    var proj=it.kind==='project';
    var fill=proj?'#c8a96e':'#1a1a22', stroke=proj?'#fff':'#c8a96e';
    var ic=proj?IC.project:(IC[TYPE_IC[it.d.type]]||IC.house);
    var lbl=proj?(it.d.name||''):(shortPrice(it.d.price)||'');
    var sz=proj?[44,52]:[38,46];
    return L.divIcon({className:'',iconSize:sz,iconAnchor:[sz[0]/2,sz[1]],
      html:'<div class="mk'+(proj?' proj':'')+(_selKey===it.key?' sel':'')+'" style="width:'+sz[0]+'px;height:'+sz[1]+'px" data-key="'+esc(it.key)+'">'
        +'<svg class="pin" width="'+sz[0]+'" height="'+sz[1]+'" viewBox="0 0 38 46"><path d="M19 44.5S35 30 35 18.5A16 16 0 0 0 3 18.5C3 30 19 44.5 19 44.5z" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2.5"/></svg>'
        +'<div class="mk-ic"'+(proj?' style="top:9px"':'')+'>'+ic+'</div>'
        +(lbl?'<div class="mk-lbl">'+esc(lbl)+'</div>':'')
        +'</div>'});
  }

  function rebuildMarkers(){
    Object.keys(_markers).forEach(function(k){map.removeLayer(_markers[k]);});
    _markers={};
    var list=filteredItems();
    /* العروض بدون إحداثيات دقيقة توضع حول مركز مدينتها حتى لا تتراكب */
    var perCity={};
    list.forEach(function(it){
      var pos=offerCoords(it.d); if(!pos) return;
      var c=pos.c.slice();
      if(!pos.exact){
        var k=c.join(','), i=perCity[k]=(perCity[k]||0)+1;
        var a=i*2.39996, r=0.012*Math.sqrt(i);
        c=[c[0]+r*Math.cos(a), c[1]+r*Math.sin(a)];
      }
      it.coords=c;
      var m=L.marker(c,{icon:markerIcon(it),riseOnHover:true,zIndexOffset:it.kind==='project'?500:0}).addTo(map);
      m.on('click',function(e){ L.DomEvent.stopPropagation(e); selectItem(it,false); });
      _markers[it.key]=m;
    });
    _lastList=list;
    document.getElementById('panel-num').textContent=list.length;
    document.getElementById('empty-state').style.display=list.length?'none':'block';
    rebuildPanelList(list);
    updateLabels();
  }
  var _lastList=[];

  function updateLabels(){ document.getElementById('map').classList.toggle('show-lbl',map.getZoom()>=12); }
  map.on('zoomend',updateLabels);

  function setSel(key){
    if(_selKey&&_markers[_selKey]&&_markers[_selKey]._icon){ var o=_markers[_selKey]._icon.querySelector('.mk'); if(o) o.classList.remove('sel'); }
    _selKey=key;
    if(key&&_markers[key]&&_markers[key]._icon){ var n=_markers[key]._icon.querySelector('.mk'); if(n) n.classList.add('sel'); }
  }

  function selectItem(it,fly){
    setSel(it.key);
    if(_panelOpen){ _panelOpen=false; document.getElementById('panel').classList.add('collapsed'); }
    if(it.coords&&fly){
      map.flyTo(it.coords,Math.max(map.getZoom(),14),{duration:.7});
      map.once('moveend',function(){ showCard(it); });
      return;
    }
    if(it.coords&&it.kind==='project') map.panTo(it.coords,{animate:true});
    showCard(it);
  }

  /* ── CARD ── */
  function showCard(it){
    var d=it.d, html;
    if(it.kind==='project'){
      var SP=window.SharkProjects, s=SP.stats(d), K=SP.kind(d);
      html='<div class="mc-row">'
        +(d.coverImg?'<img class="mc-img" src="'+esc(d.coverImg)+'">':'<div class="mc-img">🏗️</div>')
        +'<div class="mc-info">'
        +'<div class="mc-tag">مشاريع شركائنا · '+esc(K.label)+'</div>'
        +'<div class="mc-name">'+esc(d.name)+'</div>'
        +'<div class="mc-loc">📍 '+esc((d.city||'')+(d.district?' · '+d.district:''))+'</div>'
        +(s.total?'<div class="mc-meta"><span style="color:#16a34a;font-weight:800">'+s.available+' '+K.units+' متاحة</span><span>من '+s.total+'</span></div>'
          +'<div class="mc-bar"><span style="width:'+(s.available/s.total*100)+'%;background:#16a34a"></span><span style="width:'+(s.reserved/s.total*100)+'%;background:#d97706"></span><span style="width:'+(s.sold/s.total*100)+'%;background:#dc2626"></span></div>':'')
        +(s.minPrice?'<div class="mc-price">تبدأ من '+fmt(s.minPrice)+'</div>':'')
        +'</div></div>'
        +'<div class="mc-acts"><button class="mc-pri" onclick="location.href=\'project.html?id='+encodeURIComponent(d.id)+'\'">عرض المشروع والمخطط</button>'
        +'<button class="mc-sec" onclick="location.href=\'project.html?id='+encodeURIComponent(d.id)+'#book\'">احجز / سجّل اهتمامك</button></div>';
    } else {
      html=(d.coverImg?'<img class="oc-img" src="'+esc(d.coverImg)+'">':'<div class="oc-img">🏠</div>')
        +'<div class="oc-body">'
        +'<div class="mc-tag">'+(TL[d.type]||d.type||'عقار')+'</div>'
        +'<div class="mc-name">'+esc(d.ar||d.name||'عرض عقاري')+'</div>'
        +'<div class="mc-loc">📍 '+esc((d.city||'')+(d.district?' · '+d.district:''))+'</div>'
        +((d.area||d.beds)?'<div class="mc-meta">'+(d.area?'<span>📐 '+d.area+' م²</span>':'')+(d.beds?'<span>🛏 '+d.beds+'</span>':'')+'</div>':'')
        +(d.price?'<div class="mc-price">'+fmt(d.price)+'</div>':'')
        +'</div>'
        +'<div class="mc-acts"><button class="mc-pri" onclick="showMod(\''+esc(d.id)+'\')">تفاصيل العرض</button>'
        +'<button class="mc-wa" title="واتساب" onclick="waOffer(\''+esc(d.ar||d.name||'')+'\')"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.121 1.533 5.847L.054 23.272a.5.5 0 0 0 .625.613l5.563-1.46A11.952 11.952 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg></button></div>';
    }
    if(it.kind==='project'){
      if(_offerPop){ map.closePopup(_offerPop); }
      document.getElementById('mcard-body').innerHTML=html;
      document.getElementById('mcard').classList.add('open');
    } else {
      document.getElementById('mcard').classList.remove('open');
      if(!it.coords){ showMod(d.id); return; }
      _offerPop=L.popup({className:'ocard-pop',offset:[0,-42],maxWidth:250,minWidth:250,autoPan:true,
          autoPanPaddingTopLeft:L.point(12,70),autoPanPaddingBottomRight:L.point(12,80)})
        .setLatLng(it.coords).setContent(html).openOn(map);
      _offerPop.on('remove',function(){ if(_selKey===it.key) setSel(null); });
    }
  }
  var _offerPop=null;
  window.closeCard=function(){
    document.getElementById('mcard').classList.remove('open');
    if(_offerPop) map.closePopup(_offerPop);
    setSel(null);
  };

  function rebuildPanelList(list){
    var el=document.getElementById('panel-body');
    if(!list.length){
      el.innerHTML='<div style="text-align:center;padding:32px 12px;color:var(--sub);font-size:13px">لا توجد نتائج في هذا التصفية</div>';
      return;
    }
    el.innerHTML=list.map(function(it){
      var d=it.d, proj=it.kind==='project';
      var s=proj?window.SharkProjects.stats(d):null, K=proj?window.SharkProjects.kind(d):null;
      return '<div class="list-card" onclick="focusItem(\''+esc(it.key)+'\')">'
        +'<div class="list-card-img">'+(d.coverImg?'<img src="'+esc(d.coverImg)+'" loading="lazy">':(proj?'🏗️':'🏠'))+'</div>'
        +'<div class="list-card-info">'
        +'<div class="list-card-tag'+(proj?' proj':'')+'">'+(proj?'مشروع شريك · '+K.label:(TL[d.type]||d.type||'عقار'))+'</div>'
        +'<div class="list-card-name">'+esc(proj?d.name:(d.ar||d.name||'عرض عقاري'))+'</div>'
        +'<div class="list-card-loc">📍 '+esc((d.city||'')+(d.district?' · '+d.district:''))+'</div>'
        +(proj?(s.total?'<div class="list-card-price">'+s.available+' '+K.units+' متاحة من '+s.total+'</div>':'')
          :(d.price?'<div class="list-card-price">'+fmt(d.price)+'</div>':''))
        +'</div></div>';
    }).join('');
  }

  function openPanel(){
    rebuildPanelList(_lastList);
    document.getElementById('panel').classList.remove('collapsed');
    _panelOpen=true;
  }

  window.togglePanel=function(){
    _panelOpen=!_panelOpen;
    document.getElementById('panel').classList.toggle('collapsed',!_panelOpen);
    if(_panelOpen) closeCard();
  };

  window.focusItem=function(key){
    var it=_lastList.find(function(x){return x.key===key;});
    if(!it) return;
    if(!it.coords){
      if(it.kind==='project') location.href='project.html?id='+encodeURIComponent(it.d.id);
      else showMod(it.d.id);
      return;
    }
    selectItem(it,true);
  };

  /* ── OFFER MODAL ── */
  window.showMod=function(id){
    var o=_allOffers.find(function(x){return x.id===id;}); if(!o) return;
    var imgs=o.gallery?o.gallery.split('\n').filter(Boolean):[];
    document.getElementById('mod-body').innerHTML=
      (o.coverImg?'<img class="od-img" src="'+esc(o.coverImg)+'">':'<div class="od-noimg">🏠</div>')
      +'<div style="font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--gold);margin-bottom:5px">'+(TL[o.type]||o.type||'عقار')+'</div>'
      +'<div style="font-size:17px;font-weight:800;margin-bottom:6px">'+esc(o.ar||o.name||'')+'</div>'
      +'<div style="font-size:13px;color:var(--gold);margin-bottom:14px">📍 '+esc((o.city||'')+(o.district?' — '+o.district:''))+'</div>'
      +'<div class="od-stats">'
      +(o.price?'<div class="od-s"><div class="od-sv">'+fmt(o.price)+'</div><div class="od-sk">السعر</div></div>':'')
      +(o.area?'<div class="od-s"><div class="od-sv">'+o.area+' م²</div><div class="od-sk">المساحة</div></div>':'')
      +(o.beds?'<div class="od-s"><div class="od-sv">'+o.beds+'</div><div class="od-sk">غرف</div></div>':'')
      +'</div>'
      +(o.desc?'<p style="font-size:13px;color:var(--sub);line-height:1.8;margin-bottom:14px">'+esc(o.desc)+'</p>':'')
      +(imgs.length?'<div style="display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none">'+imgs.map(function(s){return'<img src="'+esc(s)+'" style="height:64px;width:96px;object-fit:cover;border-radius:7px;flex-shrink:0">';}).join('')+'</div>':'')
      +'<button class="btn-wa-od" onclick="waOffer(\''+esc(o.ar||o.name||'')+'\')">'
      +'<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="margin-left:6px"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.121 1.533 5.847L.054 23.272a.5.5 0 0 0 .625.613l5.563-1.46A11.952 11.952 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg>'
      +'تواصل عبر واتساب</button>'
      +'<button class="btn-int-od" onclick="closeMod()">إغلاق</button>';
    document.getElementById('mod-offer').classList.add('open');
  };
  window.closeMod=function(){document.getElementById('mod-offer').classList.remove('open');};
  window.waOffer=function(t){window.open('https://wa.me/'+PHONE+'?text='+encodeURIComponent('السلام عليكم، أنا مهتم بالعقار: '+t),'_blank');};

  /* ── FILTERS ── */
  window.setFilter=function(type,btn){
    _filter=type;
    document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');});
    btn.classList.add('on');
    closeCard();
    rebuildMarkers();
  };
  window.onSearch=function(v){
    _search=v;
    closeCard();
    rebuildMarkers();
  };

  /* ── INIT ── */
  function initFS(){
    var cfg={apiKey:"AIzaSyCJ59kjkb7mZ7pcsLImkT4L2-fdHFDTVko",authDomain:"sharek-re.firebaseapp.com",projectId:"sharek-re",storageBucket:"sharek-re.firebasestorage.app",messagingSenderId:"1000796915275",appId:"1:1000796915275:web:bb556f80db9d2f7f99efce"};
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    return firebase.firestore();
  }
  function afterLoad(){
    rebuildMarkers();
    if(_lastList.length&&window.innerWidth>=700){ openPanel(); }
  }
  var pOffers=new Promise(function(res){
    try{
      var fsdb=initFS();
      fsdb.collection('offers').orderBy('_ts','desc').get()
        .then(function(snap){
          _allOffers=snap.docs.map(function(d){return d.data();});
          if(!_allOffers.length) _allOffers=gs('shark_offers')||[];
          res();
        })
        .catch(function(){ _allOffers=gs('shark_offers')||[]; res(); });
    }catch(e){ _allOffers=gs('shark_offers')||[]; res(); }
  });
  var pProjects=window.SharkProjects?SharkProjects.loadPublished().then(function(l){_projects=l;}).catch(function(){}):Promise.resolve();
  Promise.all([pOffers,pProjects]).then(function(){
    var f=new URLSearchParams(location.search).get('filter');
    if(f==='projects'){ var b=[].slice.call(document.querySelectorAll('.chip')).find(function(c){return c.textContent.indexOf('مشاريع')>=0;}); if(b){ setFilter('projects',b); } }
    afterLoad();
  });

  /* close card on map click */
  map.on('click',function(){ closeCard(); });
})();
</script>
</body>
</html>
