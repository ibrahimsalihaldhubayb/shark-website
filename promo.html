<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0b0c">
<title id="pg-title">سجّل اهتمامك بالعقار — شارك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;
  font-family:'Cairo',Tahoma,Arial,sans-serif;
  direction:rtl;
  -webkit-font-smoothing:antialiased;
}
body{
  min-height:100vh;
  background:#0b0b0c;
  color:#f4f3ef;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  overflow-x:hidden;
}

/* BG */
.bg{position:fixed;inset:0;z-index:0}
#bg-img{width:100%;height:100%;object-fit:cover;opacity:.5;display:none}
.bg-fallback{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 100% 60% at 50% 100%, rgba(160,110,30,.25) 0%, transparent 65%),
    linear-gradient(160deg,#111009 0%,#0e0c09 45%,#0b0b0c 100%);
}
.bg-fallback::before{
  content:'';position:absolute;inset:0;
  background-image:
    repeating-linear-gradient(0deg,transparent,transparent 59px,rgba(180,145,50,.05) 59px,rgba(180,145,50,.05) 60px),
    repeating-linear-gradient(90deg,transparent,transparent 59px,rgba(180,145,50,.05) 59px,rgba(180,145,50,.05) 60px);
}
.bg-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(8,7,5,.4) 0%,rgba(8,7,5,.5) 40%,rgba(8,7,5,.82) 100%);
}

/* PAGE */
.page{
  position:relative;z-index:1;
  width:100%;
  max-width:440px;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:48px 20px 36px;
}

/* LOGO */
.logo-block{
  display:flex;flex-direction:column;align-items:center;
  gap:12px;margin-bottom:28px;
}
.logo-bars{display:flex;align-items:flex-end;gap:5px;height:50px}
.logo-bars b{
  display:block;border-radius:2px 2px 0 0;
  background:linear-gradient(to bottom,#fff 0%,rgba(255,255,255,0) 100%);
}
.logo-name{
  font-size:42px;font-weight:900;
  color:#fff;letter-spacing:.08em;
  line-height:1;position:relative;
  font-family:'Cairo',sans-serif;
}
.logo-name::after{
  content:'';display:block;
  height:2px;background:linear-gradient(90deg,transparent,rgba(200,151,46,.8),transparent);
  margin-top:4px;
}
.logo-tagline{
  font-size:12px;font-weight:300;
  color:rgba(244,243,239,.5);
  letter-spacing:.14em;
  margin-top:-4px;
}

/* HEADLINE */
.headline{
  font-size:32px;font-weight:800;
  text-align:center;line-height:1.3;
  margin-bottom:10px;
  color:#fff;
}
.subline{
  font-size:14px;font-weight:400;
  color:rgba(244,243,239,.62);
  text-align:center;line-height:1.7;
  margin-bottom:28px;
  max-width:300px;
}

/* CARD */
.card{
  width:100%;
  background:rgba(18,15,11,.78);
  border:1px solid rgba(244,243,239,.12);
  border-radius:18px;
  padding:26px 20px 22px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}

.f-label{
  display:block;text-align:right;
  font-size:14px;font-weight:600;
  color:#f4f3ef;
  margin-bottom:8px;
}
.f-label em{font-style:normal;font-weight:400;font-size:12px;color:rgba(244,243,239,.45)}
.f-input,.f-textarea{
  width:100%;padding:14px 14px;
  background:rgba(30,24,16,.65);
  border:1px solid rgba(244,243,239,.12);
  border-radius:10px;
  color:#f4f3ef;font-size:15px;font-weight:400;
  font-family:'Cairo',sans-serif;direction:rtl;
  outline:none;
  transition:border-color .2s;
  -webkit-appearance:none;
  margin-bottom:16px;
}
.f-input:focus,.f-textarea:focus{
  border-color:rgba(200,151,46,.55);
}
.f-input::placeholder,.f-textarea::placeholder{
  color:rgba(244,243,239,.28);
}
.f-textarea{resize:none;height:88px;line-height:1.55}

.btn-submit{
  width:100%;
  padding:16px;
  background:linear-gradient(135deg,#c8972e 0%,#d4a83c 60%,#b8821c 100%);
  color:#0b0b0c;border:none;border-radius:10px;
  font-family:'Cairo',sans-serif;
  font-size:17px;font-weight:700;
  cursor:pointer;letter-spacing:.03em;
  transition:opacity .18s,transform .1s;
  margin-top:4px;
}
.btn-submit:active{transform:scale(.98);opacity:.88}
.btn-submit:disabled{opacity:.55;cursor:not-allowed}

/* PRIVACY */
.privacy{
  margin-top:18px;
  font-size:11.5px;font-weight:300;
  color:rgba(244,243,239,.38);
  text-align:center;line-height:1.8;
  max-width:320px;
}

/* SUCCESS */
.success-box{display:none;text-align:center;padding:12px 0}
.success-check{
  width:56px;height:56px;border-radius:50%;
  background:rgba(200,151,46,.15);border:1px solid rgba(200,151,46,.4);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 20px;font-size:22px;color:#c8972e;
}
.success-box h2{font-size:22px;font-weight:700;margin-bottom:10px}
.success-box p{font-size:13px;font-weight:300;color:rgba(244,243,239,.55);line-height:1.8;margin-bottom:22px}
.btn-wa{
  display:inline-flex;align-items:center;gap:10px;
  padding:13px 24px;border-radius:10px;
  background:transparent;
  border:1px solid rgba(37,211,102,.35);
  color:rgba(37,211,102,.85);
  font-family:'Cairo',sans-serif;font-size:14px;font-weight:500;
  cursor:pointer;transition:background .2s;
}
.btn-wa:hover{background:rgba(37,211,102,.07)}

/* SOCIAL */
.social{
  display:flex;gap:22px;align-items:center;
  margin-top:28px;
}
.social a{color:rgba(244,243,239,.35);text-decoration:none;transition:color .2s}
.social a:hover{color:rgba(244,243,239,.7)}
</style>
</head>
<body>

<div class="bg">
  <div class="bg-fallback" id="bg-fallback"></div>
  <img id="bg-img" alt="">
  <div class="bg-overlay"></div>
</div>

<div class="page">

  <div class="logo-block">
    <div class="logo-bars">
      <b style="width:7px;height:20px"></b>
      <b style="width:7px;height:32px"></b>
      <b style="width:7px;height:44px"></b>
      <b style="width:7px;height:32px"></b>
      <b style="width:7px;height:20px"></b>
    </div>
    <div class="logo-name">شـارك</div>
    <div class="logo-tagline">شركة ركن شارك العقارية</div>
  </div>

  <h1 class="headline" id="main-headline">سجّل اهتمامك بالعقار</h1>
  <p class="subline" id="main-subline">اترك بياناتك وسيتواصل معك فريقنا بأقرب فرصة</p>

  <div class="card">
    <div id="form-wrap">
      <label class="f-label">الاسم الكامل</label>
      <input type="text" class="f-input" id="f-name" placeholder="مثال: عبدالله المطيري" autocomplete="name">

      <label class="f-label">رقم الجوال</label>
      <input type="tel" class="f-input" id="f-phone" placeholder="05xxxxxxxx" dir="ltr" style="text-align:right" autocomplete="tel">

      <label class="f-label">ملاحظة <em>(اختياري)</em></label>
      <textarea class="f-textarea" id="f-note" placeholder="اكتب ملاحظتك هنا"></textarea>

      <button class="btn-submit" id="btn-submit" onclick="doSubmit()">سجّل اهتمامك</button>
    </div>

    <div class="success-box" id="success-box">
      <div class="success-check">✓</div>
      <h2>تم استلام طلبك</h2>
      <p>شكراً لتواصلك مع شارك العقارية<br>سيتصل بك أحد مستشارينا قريباً</p>
      <button class="btn-wa" onclick="goWa()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.121 1.533 5.847L.054 23.272a.5.5 0 0 0 .625.613l5.563-1.46A11.952 11.952 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.9 0-3.68-.528-5.195-1.443l-.371-.22-3.844 1.009 1.03-3.74-.243-.386A9.96 9.96 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
        التواصل عبر واتساب
      </button>
    </div>
  </div>

  <p class="privacy">نحترم خصوصيتك: رقم جوالك يُعامَل بسرية تامة ولا تتم مشاركته مع أي جهة أخرى، ويكون التواصل فقط بخصوص اهتمامك بالعقار.</p>

  <div class="social">
    <a href="#" aria-label="Instagram">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
    </a>
    <a href="#" aria-label="X">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
    </a>
    <a href="#" aria-label="Snapchat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.065.001c1.778-.004 3.519.47 4.96 1.421 1.44.95 2.477 2.3 2.977 3.85.25.78.375 1.59.375 2.41v.74c0 .42.02.83.06 1.23.04.4.28 1.66 1.35 2.36.22.14.27.42.13.64l-.01.01c-.14.22-.88 1.07-2.87 1.07-.29 0-.59-.02-.91-.07-.27-.04-.53-.04-.8.02-.35.07-.67.26-.92.52-.6.63-.91 1.68-.91 2.85 0 .07 0 .14-.01.2-.06.55-.36.78-.68.78-.2 0-.45-.09-.76-.25a6.11 6.11 0 00-2.46-.53c-.85 0-1.69.18-2.46.53-.32.17-.57.25-.76.25-.32 0-.62-.23-.68-.78-.01-.06-.01-.13-.01-.2 0-1.17-.31-2.22-.91-2.85a1.86 1.86 0 00-.92-.52c-.27-.06-.53-.06-.8-.02-.32.05-.62.07-.91.07-1.99 0-2.73-.85-2.87-1.07l-.01-.01a.47.47 0 01.13-.64c1.07-.7 1.31-1.96 1.35-2.36.04-.4.06-.81.06-1.23v-.74c0-.82.125-1.63.375-2.41.5-1.55 1.537-2.9 2.977-3.85C8.546.47 10.287-.003 12.065.001z"/></svg>
    </a>
  </div>

</div>

<script>
(function(){
  var SHEETS_URL = 'https://script.google.com/macros/s/AKfycbyHVwZPpmNrCOrXjbzlrrkz1tYcA1v7MXvDfwlPFYKUMzV3ICTmpYsNP22HH6dsF7k/exec';
  var PHONE = '966539997060';

  var params = new URLSearchParams(location.search);
  var key = params.get('k');
  var promo = null;

  if(key){
    try{
      var ps = JSON.parse(localStorage.getItem('shark_promos')||'[]');
      promo = ps.find(function(p){return p.id===key;})||null;
    }catch(e){}
  }

  if(promo){
    if(promo.headline){
      document.getElementById('main-headline').textContent = promo.headline;
      document.title = promo.headline + ' — شارك';
    }
    if(promo.subline) document.getElementById('main-subline').textContent = promo.subline;
    if(promo.coverImg){
      var img = document.getElementById('bg-img');
      img.src = promo.coverImg;
      img.style.display = 'block';
      document.getElementById('bg-fallback').style.display = 'none';
    }
  }

  window.goWa = function(){
    if(!PHONE){ alert('لم يتم ضبط رقم الواتساب — يرجى ضبطه من لوحة التحكم'); return; }
    var name = (document.getElementById('f-name').value||'').trim();
    var title = promo ? (promo.headline||'شارك العقارية') : 'شارك العقارية';
    var msg = 'السلام عليكم، تواصلت عبر إعلان "'+title+'"'+(name?' — '+name:'')+'\n'+location.href;
    window.open('https://wa.me/'+PHONE+'?text='+encodeURIComponent(msg),'_blank');
  };

  window.doSubmit = function(){
    var name  = document.getElementById('f-name').value.trim();
    var phone = document.getElementById('f-phone').value.trim();
    var note  = document.getElementById('f-note').value.trim();
    if(!name) { alert('الرجاء إدخال الاسم الكريم'); return; }
    if(!phone){ alert('الرجاء إدخال رقم الجوال'); return; }

    var btn = document.getElementById('btn-submit');
    btn.disabled = true; btn.textContent = 'جارٍ الإرسال...';

    var date = new Date().toLocaleString('ar-SA',{timeZone:'Asia/Riyadh'});
    var rec = {
      id:'SK-'+(Date.now()%100000), name:name, phone:phone, note:note,
      type:'إعلان مروّج', promoId:key||'',
      promoTitle:promo?(promo.headline||''):'',
      source:'promo', date:date
    };

    /* save locally */
    try{
      var arr = JSON.parse(localStorage.getItem('shark_admin_clients')||'[]');
      arr.unshift(rec);
      localStorage.setItem('shark_admin_clients', JSON.stringify(arr));
    }catch(e){}

    /* send to sheets */
    try{
      var payload = JSON.stringify({date:date, name:name, phone:phone, note:note});
      fetch(SHEETS_URL,{method:'POST', mode:'no-cors', body:payload});
    }catch(e){}

    document.getElementById('form-wrap').style.display = 'none';
    document.getElementById('success-box').style.display = 'block';
  };

})();
</script>
</body>
</html>
