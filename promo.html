<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0b0c">
<title>سجّل اهتمامك — شارك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Cairo',Tahoma,Arial,sans-serif;direction:rtl;-webkit-font-smoothing:antialiased}
body{
  background:#0b0b0c;
  color:#f4f3ef;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow-x:hidden;
}

.bg{
  width:100%;
  max-width:460px;
  position:relative;
}
.bg img{
  width:100%;
  display:block;
}

.page{
  width:100%;
  max-width:460px;
  padding:0 18px 36px;
  margin-top:-420px;
  position:relative;
  z-index:1;
}

.card{
  width:100%;
  background:rgba(18,14,10,.82);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  padding:24px 18px 20px;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
}

.f-label{
  display:block;text-align:right;
  font-size:14px;font-weight:700;
  color:#f4f3ef;margin-bottom:7px;
}
.f-label em{font-style:normal;font-weight:400;font-size:13px;color:rgba(244,243,239,.45)}
.f-input,.f-textarea{
  width:100%;padding:14px;
  background:rgba(40,30,18,.7);
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;
  color:#f4f3ef;font-size:15px;font-weight:400;
  font-family:'Cairo',sans-serif;direction:rtl;
  outline:none;transition:border-color .2s;
  -webkit-appearance:none;margin-bottom:14px;display:block;
}
.f-input:focus,.f-textarea:focus{border-color:rgba(200,151,46,.55)}
.f-input::placeholder,.f-textarea::placeholder{color:rgba(244,243,239,.28)}
.f-textarea{resize:none;height:86px;line-height:1.55}

.btn-submit{
  width:100%;padding:16px;
  background:linear-gradient(135deg,#c8972e 0%,#d4a83c 55%,#ba8420 100%);
  color:#1a1000;border:none;border-radius:10px;
  font-family:'Cairo',sans-serif;font-size:17px;font-weight:800;
  cursor:pointer;letter-spacing:.02em;
  transition:opacity .18s,transform .1s;
  display:block;width:100%;margin-top:2px;
}
.btn-submit:active{transform:scale(.98);opacity:.88}
.btn-submit:disabled{opacity:.55;cursor:not-allowed}

.privacy{
  margin-top:14px;font-size:11px;font-weight:300;
  color:rgba(244,243,239,.32);text-align:center;
  line-height:1.85;padding:0 4px;
}

.success-box{display:none;text-align:center;padding:10px 0}
.success-check{
  width:54px;height:54px;border-radius:50%;
  background:rgba(200,151,46,.12);border:1px solid rgba(200,151,46,.35);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 16px;font-size:22px;color:#c8972e;
}
.success-box h2{font-size:22px;font-weight:700;margin-bottom:10px}
.success-box p{font-size:13px;font-weight:300;color:rgba(244,243,239,.55);line-height:1.8;margin-bottom:20px}
.btn-wa{
  display:inline-flex;align-items:center;gap:10px;padding:13px 24px;
  border-radius:10px;background:transparent;
  border:1px solid rgba(37,211,102,.35);color:rgba(37,211,102,.85);
  font-family:'Cairo',sans-serif;font-size:14px;font-weight:500;cursor:pointer;
}
</style>
</head>
<body>

<div class="bg">
  <img src="bg-promo.webp" alt="">
</div>

<div class="page">
  <div class="card">
    <div id="form-wrap">
      <label class="f-label">الاسم الكامل</label>
      <input type="text" class="f-input" id="f-name" placeholder="مثال: عبدالله المطيري" autocomplete="name">

      <label class="f-label">رقم الجوال</label>
      <input type="tel" class="f-input" id="f-phone" placeholder="05xxxxxxxx" dir="ltr" style="text-align:right" autocomplete="tel">

      <label class="f-label">ملاحظة <em>(اختياري)</em></label>
      <textarea class="f-textarea" id="f-note" placeholder="اكتب ملاحظتك هنا"></textarea>

      <button class="btn-submit" id="btn-submit" onclick="doSubmit()">سجّل اهتمامك</button>
    </div>

    <div class="success-box" id="success-box">
      <div class="success-check">✓</div>
      <h2>تم استلام طلبك</h2>
      <p>شكراً لتواصلك مع شارك العقارية<br>سيتصل بك أحد مستشارينا قريباً</p>
      <button class="btn-wa" onclick="goWa()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.127.558 4.121 1.533 5.847L.054 23.272a.5.5 0 0 0 .625.613l5.563-1.46A11.952 11.952 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.9 0-3.68-.528-5.195-1.443l-.371-.22-3.844 1.009 1.03-3.74-.243-.386A9.96 9.96 0 0 1 2 12C2 6.477 6.477 2 12 2s10 4.477 10 10-4.477 10-10 10z"/></svg>
        التواصل عبر واتساب
      </button>
    </div>
  </div>

  <p class="privacy">نحترم خصوصيتك: رقم جوالك يُعامَل بسرية تامة ولا تتم مشاركته مع أي جهة أخرى، ويكون التواصل فقط بخصوص اهتمامك بالعقار.</p>
</div>

<script>
(function(){
  var SHEETS_URL = 'https://script.google.com/macros/s/AKfycbyHVwZPpmNrCOrXjbzlrrkz1tYcA1v7MXvDfwlPFYKUMzV3ICTmpYsNP22HH6dsF7k/exec';
  var PHONE = '966539997060';

  window.goWa = function(){
    var name = (document.getElementById('f-name').value||'').trim();
    var msg = 'السلام عليكم، أود الاستفسار عن العقار'+(name?' — '+name:'')+'\n'+location.href;
    window.open('https://wa.me/'+PHONE+'?text='+encodeURIComponent(msg),'_blank');
  };

  window.doSubmit = function(){
    var name  = document.getElementById('f-name').value.trim();
    var phone = document.getElementById('f-phone').value.trim();
    var note  = document.getElementById('f-note').value.trim();
    if(!name) { alert('الرجاء إدخال الاسم الكريم'); return; }
    if(!phone){ alert('الرجاء إدخال رقم الجوال'); return; }

    var btn = document.getElementById('btn-submit');
    btn.disabled = true; btn.textContent = 'جارٍ الإرسال...';

    var date = new Date().toLocaleString('ar-SA',{timeZone:'Asia/Riyadh'});
    var rec = {id:'SK-'+(Date.now()%100000),name:name,phone:phone,note:note,source:'promo',date:date};

    try{
      var arr = JSON.parse(localStorage.getItem('shark_admin_clients')||'[]');
      arr.unshift(rec); localStorage.setItem('shark_admin_clients',JSON.stringify(arr));
    }catch(e){}

    try{
      fetch(SHEETS_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({date:date,name:name,phone:phone,note:note})});
    }catch(e){}

    document.getElementById('form-wrap').style.display='none';
    document.getElementById('success-box').style.display='block';
  };
})();
</script>
</body>
</html>
