<style>
body{margin:0;background:var(--surface-raised);color:var(--ink);font-family:var(--font-arabic)}
header{display:flex;align-items:center;gap:16px;padding:24px 32px;background:var(--surface);border-bottom:1px solid var(--hairline)}
header img{height:40px} header h1{font:700 22px/1.4 var(--font-kufi);margin:0} header p{margin:0;color:var(--muted);font-size:14px}
main{padding:16px 32px 64px;max-width:1500px;margin:auto}
h2{font:700 18px/1.4 var(--font-kufi);margin:40px 0 16px}
.card{margin:0 0 24px;background:var(--surface);border:1px solid var(--hairline);border-radius:6px;overflow:hidden}
figcaption{display:flex;gap:12px;align-items:baseline;padding:12px 16px;border-bottom:1px solid var(--hairline)}
figcaption span{color:var(--muted);font-size:13px;flex:1} figcaption a{color:var(--ink);font-size:13px}
.frame{overflow:auto}
iframe{display:block;border:0;width:calc(var(--w)*1px);height:calc(var(--h)*1px);max-width:none}
@media (max-width:768px){header,main{padding-inline:16px}}
