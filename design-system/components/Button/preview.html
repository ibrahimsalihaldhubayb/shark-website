<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shark · Button</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
</head><body>
<!-- @dsCard group="Actions" height=150 subtitle="أساسي، ثانوي، شفاف، حذف" -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:var(--surface)}</style>
<div class="sh-root" dir="rtl" style="padding:24px">
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">
<button class="sh-btn sh-btn-primary"><svg class="sh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>إضافة عرض</button>
<button class="sh-btn sh-btn-secondary"><svg class="sh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-5L3 9M4 13a8 8 0 0 0 14 5l3-3"/><path d="M3 4v5h5M21 20v-5h-5"/></svg>تحديث</button>
<button class="sh-btn sh-btn-ghost">إلغاء</button>
<button class="sh-btn sh-btn-danger"><svg class="sh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>حذف</button>
<button class="sh-btn sh-btn-primary" disabled>حفظ</button></div>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px">
<button class="sh-btn sh-btn-secondary sh-btn-sm"><svg class="sh-icon sh-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>واتساب</button>
<button class="sh-btn sh-btn-secondary sh-btn-sm"><svg class="sh-icon sh-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 20h4v-3"/></svg>إعلان QR</button>
<button class="sh-btn sh-btn-ghost sh-btn-sm"><svg class="sh-icon sh-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>تعديل</button>
<button class="sh-iconbtn" aria-label="الموقع"><svg class="sh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></button><button class="sh-iconbtn" aria-label="المزيد"><svg class="sh-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div>
</div>
</body></html>
