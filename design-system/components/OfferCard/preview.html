<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shark · OfferCard</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
</head><body>
<!-- @dsCard group="Offers" height=560 subtitle="عرض حصري وعرض غير حصري" -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:var(--surface-raised)}</style>
<div class="sh-root" dir="rtl" style="padding:24px">
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,360px));gap:20px">
<article class="sh-offer sh-offer-exclusive">
  <div class="sh-offer-media"><img src="../../assets/Samples/offer-huwaylan.jpg" alt="">
    <div class="sh-offer-tags"><span class="sh-badge sh-badge-exclusive"><svg class="sh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>حصري</span><span class="sh-badge sh-badge-outline">تجاري</span></div></div>
  <div class="sh-offer-body">
    <div class="sh-offer-head"><h3 class="sh-offer-title">أرض تجارية حويلان</h3><span class="sh-offer-ref">OF-MVZB3PPF</span></div>
    <div class="sh-offer-meta"><span><svg class="sh-icon sh-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>بريدة · حي حويلان</span><span><svg class="sh-icon sh-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg><bdi class="sh-num">6,030.67</bdi> م²</span></div>
    <div class="sh-offer-price-ask">السعر عند الطلب</div>
    <div class="sh-offer-note"><small>إبراهيم الضبيب · ملاحظة</small>السعي ٢٪</div>
  </div>
  <div class="sh-offer-foot"><span class="sh-badge sh-badge-success sh-badge-dot">منشور</span>
    <div class="sh-offer-actions"><button class="sh-iconbtn" aria-label="الموقع"><svg class="sh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></button><button class="sh-iconbtn" aria-label="المستندات"><svg class="sh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg></button><button class="sh-iconbtn" aria-label="مشاركة"><svg class="sh-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></button><button class="sh-iconbtn" aria-label="المزيد"><svg class="sh-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div>
  </div>
</article>
<article class="sh-offer">
  <div class="sh-offer-media"><img src="../../assets/Samples/offer-wusayta.jpg" alt="">
    <div class="sh-offer-tags"><span class="sh-badge sh-badge-outline">غير حصري</span><span class="sh-badge sh-badge-outline">سكني</span></div></div>
  <div class="sh-offer-body">
    <div class="sh-offer-head"><h3 class="sh-offer-title">أرض الوسيطاء سكنية</h3><span class="sh-offer-ref">OF-MVZAVL80</span></div>
    <div class="sh-offer-meta"><span><svg class="sh-icon sh-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>بريدة · حي الوسيطاء</span><span><svg class="sh-icon sh-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg><bdi class="sh-num">450</bdi> م²</span></div>
    <div class="sh-offer-price-ask">السعر عند الطلب</div>
    <div class="sh-offer-note"><small>إبراهيم الضبيب · ملاحظة</small>اتفاق: مرهونة، السعي ٢٪</div>
  </div>
  <div class="sh-offer-foot"><span class="sh-badge sh-badge-dot">غير منشور</span>
    <div class="sh-offer-actions"><button class="sh-iconbtn" aria-label="الموقع"><svg class="sh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></button><button class="sh-iconbtn" aria-label="المستندات"><svg class="sh-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg></button><button class="sh-iconbtn" aria-label="مشاركة"><svg class="sh-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg></button><button class="sh-iconbtn" aria-label="المزيد"><svg class="sh-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></div>
  </div>
</article></div>
</div>
</body></html>
